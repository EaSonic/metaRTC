version: v2.0
name: minisdp_代码质量扫描
on:
  push:
  - develop
  - master
resources:
  repositories:
  - repository: APD_Quality/TCoder_service
    name: tcoder
    ref: master
extends:
  template: pipelines/codecc.yml@tcoder
  parameters:
    languages:
    - C_CPP
    script: |-
      set -x
      yum install -y readline-devel
      export PATH=/data/bkdevops/apps/cmake/3.9.6/bin:$PATH
      export CMAKE_HOME=/data/bkdevops/apps/cmake/3.9.6/
      sh build.sh
    gatekeepers:
    - ${{ ci.actor }}
    - zanehzhang
    - harcharchen
    receivers:
    - ${{ ci.actor }}
    image: mirrors.tencent.com/ci/tlinux_ci:3.5.1
    enableSubmodule: true
    gateTemplate: gates/old_codecc.yml